[project]
name = "alcohol-catalog-collector"
version = "0.1.0"
description = "Auditable collector for spirits and sake product catalogues"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10,<12",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
alcohol-catalog = "alcohol_catalog.cli:main"
alcohol-brand-websites = "alcohol_catalog.official_sites:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alcohol_catalog"]

[tool.pytest.ini_options]
pythonpath = ["src"]
