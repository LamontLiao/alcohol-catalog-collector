name: Check brand official websites

on:
  push:
    branches: [main]
    paths:
      - 'inputs/**'
      - 'config/categories.yml'
      - 'src/alcohol_catalog/brands.py'
      - 'src/alcohol_catalog/normalize.py'
      - 'src/alcohol_catalog/official_sites.py'
      - 'pyproject.toml'
      - '.github/workflows/brand-official-sites.yml'
  workflow_dispatch:
  schedule:
    - cron: '31 3 1 * *'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: alcohol-catalog clean-brands
      - uses: actions/upload-artifact@v4
        with:
          name: brand-cleaning-official-sites
          path: output/brands_cleaning.csv
          retention-days: 30

  search:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        category: [whisky, sake, tequila, gin, rum, liqueur, vodka, brandy]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: brand-cleaning-official-sites
          path: output
      - name: Restore search cache
        uses: actions/cache@v4
        with:
          path: output/website_search_cache
          key: official-sites-${{ matrix.category }}-${{ github.run_id }}
          restore-keys: official-sites-${{ matrix.category }}-
      - run: alcohol-catalog official-sites --category "${{ matrix.category }}"
      - uses: actions/upload-artifact@v4
        with:
          name: official-sites-${{ matrix.category }}
          path: output/brand_official_sites_${{ matrix.category }}.csv
          retention-days: 30
          if-no-files-found: error

  package:
    needs: search
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: official-sites-*
          path: combined
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: brand-cleaning-official-sites
          path: combined
      - name: Combine all brand results
        run: |
          python - <<'PY'
          import csv, glob
          paths = sorted(glob.glob('combined/brand_official_sites_*.csv'))
          rows, fields = [], None
          for path in paths:
              with open(path, encoding='utf-8-sig', newline='') as f:
                  reader = csv.DictReader(f)
                  fields = fields or reader.fieldnames
                  rows.extend(reader)
          with open('combined/brand_official_sites.csv', 'w', encoding='utf-8-sig', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader(); writer.writerows(rows)
          PY
          cd combined && zip -r ../brand_official_sites_complete.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: brand-official-sites-complete
          path: brand_official_sites_complete.zip
          retention-days: 30

